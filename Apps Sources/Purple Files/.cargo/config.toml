[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "code-model=large",
    "-C", "link-arg=-T../../sdk/gui/purple_gui.ld",
    "-C", "target-feature=-avx,-avx2",
    "-C", "link-arg=-nostdlib",
    "-C", "link-arg=-static",
    "-C", "link-arg=-z",
    "-C", "link-arg=max-page-size=4096",
]
