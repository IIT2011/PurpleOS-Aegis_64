[package]
name = "purple-files"
version = "1.0.0"
edition = "2021"
authors = ["Purple OS"]
description = "Purple Files — Native freestanding file explorer for Purple OS"

[[bin]]
name = "purple-files"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
panic = "abort"
opt-level = 2

[profile.release]
panic = "abort"
opt-level = "z"
lto = false
codegen-units = 1
strip = "symbols"
