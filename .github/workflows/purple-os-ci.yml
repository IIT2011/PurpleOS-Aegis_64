name: Purple OS / Aegis64 — Pure Rust CI

on:
  workflow_dispatch:
  push:
    branches:
      - Aegis_Purple
  pull_request:
    branches:
      - Aegis_Purple

permissions:
  contents: read

concurrency:
  group: purple-os-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build & Verify Pure Rust Kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
          components: rust-src

      - name: Install QEMU and Binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 binutils

      - name: Cargo Check
        run: cargo check --target x86_64-unknown-none

      - name: Cargo Build
        run: cargo build --target x86_64-unknown-none

      - name: Create Multiboot ELF32 Binary
        run: |
          mkdir -p target
          objcopy -O elf32-i386 target/x86_64-unknown-none/debug/aegis64 target/kernel.elf

      - name: QEMU Boot Verification
        run: |
          timeout 5s qemu-system-x86_64 \
            -kernel target/kernel.elf \
            -serial stdio \
            -display none \
            -m 256M \
            -smp 4 > boot.log 2>&1 || true
          cat boot.log
          grep -q "Aegis64 Kernel (Purple OS) - Pure Rust Edition" boot.log
          grep -q "Multiprocessing operational. 4/4 CPUs online." boot.log
          grep -q "aegis64@purple:~$" boot.log
          echo "Kernel Boot & SMP Verification Passed!"
