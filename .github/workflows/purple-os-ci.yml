
name: Purple OS — Desktop and Kernel CI

on:
  workflow_dispatch:
  push:
    branches:
      - Aegis_Purple
  pull_request:
    branches:
      - Aegis_Purple

permissions:
  contents: read

concurrency:
  group: purple-os-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-build-test:
    name: Audit, build and test Aegis64
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout the selected commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record source identity
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Branch/ref: $GITHUB_REF"
          git status --short --branch
          git log -1 --oneline

      - name: Install build and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc g++ make nasm \
            binutils python3 python3-pip \
            git qemu-system-x86 ovmf \
            grub-pc-bin grub-efi-amd64-bin \
            xorriso mtools dosfstools parted \
            pkg-config file

      - name: Audit desktop architecture
        shell: bash
        run: |
          mkdir -p ci-results
          {
            echo "=== Window and compositor symbols ==="
            grep -RniE \
              'window_create|window_focus|window_manager|compositor|surface_buffer|dirty_rect|damage_region|focused_window' \
              src include || true

            echo "=== Framebuffer rendering paths ==="
            grep -RniE \
              'framebuffer|draw_pixel|fill_rect|redraw|render_desktop|swap_buffer' \
              src include || true

            echo "=== Keyboard and text input paths ==="
            grep -RniE \
              'keyboard_handler|key_event|text_input|keyboard_get|scancode' \
              src include || true
          } > ci-results/desktop-audit.txt

          cat ci-results/desktop-audit.txt

      - name: Build kernel
        run: |
          set -o pipefail
          make -j2 2>&1 | tee ci-results-build.log

      - name: Run repository checks
        shell: bash
        run: |
          set -o pipefail
          make check 2>&1 | tee ci-results-test.log

      - name: Check available UEFI smoke-test targets
        if: always()
        run: |
          make -qp 2>/dev/null |
            grep -E '^[a-zA-Z0-9_.-]*(uefi|qemu|smoke|desktop)[a-zA-Z0-9_.-]*:' \
            > ci-results-targets.txt || true
          cat ci-results-targets.txt

      - name: Record build outputs and hashes
        if: always()
        run: |
          mkdir -p ci-results
          {
            for f in build/kernel.elf build/kernel64.elf \
                     build/BOOTX64.EFI build/aegis64-uefi-test.img; do
              if test -f "$f"; then
                file "$f"
                sha256sum "$f"
                stat -c '%n %s bytes' "$f"
              fi
            done
          } > ci-results/artifact-manifest.txt

          cat ci-results/artifact-manifest.txt

      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purple-os-ci-${{ github.sha }}
          path: |
            ci-results/
            ci-results-build.log
            ci-results-test.log
            build/kernel.elf
            build/kernel64.elf
            build/BOOTX64.EFI
          if-no-files-found: warn
          retention-days: 14
